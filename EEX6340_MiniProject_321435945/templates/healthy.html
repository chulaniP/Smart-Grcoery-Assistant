<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Healthy Food Suggestions</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #a1ffce, #faffd1);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            background: white;
            padding: 40px 50px;
            border-radius: 20px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            color: #4CAF50;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #d1f7d6;
            margin: 10px 0;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .back-button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background-color: #4CAF50;
            color: white;
            border-radius: 10px;
            text-decoration: none;
            transition: 0.3s;
        }

        .back-button:hover {
            background-color: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Healthy Food Suggestions</h1>
        <h2>Alternatives for: {{ item_name }}</h2>

        <ul>
            {% for suggestion in healthy_suggestions %}
            <li><i class="fas fa-leaf"></i> {{ suggestion }}</li>
            {% endfor %}
        </ul>

        <a href="{{ url_for('index') }}" class="back-button">
            <i class="fas fa-arrow-left"></i> Back to Grocery List
        </a>
    </div>
</body>
</html>
